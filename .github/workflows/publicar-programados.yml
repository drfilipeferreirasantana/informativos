# Publica os informativos programados: todo dia de manhã o GitHub gera o site de novo,
# e os posts cuja data ("data" no JSON de conteudo/) chegou passam a aparecer.
# As artes já vêm prontas do computador do escritório; aqui só as páginas são geradas.
name: Publicar informativos programados

on:
  schedule:
    - cron: "5 9 * * *"   # 6h05 em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:       # botão "Run workflow" para publicar na hora

permissions:
  contents: write

concurrency: publicar-informativos

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python ferramentas/gerar.py
      - name: Envia as páginas novas, se houver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhum post novo hoje."
          else
            git commit -m "Publica informativo programado de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi
